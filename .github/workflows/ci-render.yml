name: CI and Render Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/research_app
    defaults:
      run:
        working-directory: research_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research_app/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run backend tests
        run: python -m pytest tests -q
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          OPENAI_API_KEY: ci-placeholder

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research_app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f research_app/Dockerfile.render -t research-agent:ci research_app

  deploy:
    needs: [test-backend, build-frontend, build-render-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
