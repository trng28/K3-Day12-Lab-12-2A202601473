name: CI and Render Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}/research_app
    defaults:
      run:
        working-directory: research_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research_app/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run backend tests
        run: |
          SEMANTIC_SCHOLAR_API_KEY=ci-placeholder python -c "from tools.semantic_scholar.tool import semantic_scholar_api_key; assert semantic_scholar_api_key()"
          python -m pytest tests -q
        env:
          LLM_PROVIDER: openai
          LLM_MODEL: gpt-4o-mini
          OPENAI_API_KEY: ci-placeholder

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research_app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: research_app/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  build-render-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t research-agent:ci .
