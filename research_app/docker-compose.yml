services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./.env:/app/.env:ro
      - research_artifacts:/app/artifacts
      - arxiv_papers:/app/arxiv_papers
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  research_artifacts:
  arxiv_papers:
