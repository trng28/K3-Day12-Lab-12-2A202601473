# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: academic-paper-research-agent
    runtime: docker
    plan: free
    dockerContext: ./research_app
    dockerfilePath: ./research_app/Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false
      - key: ARXIV_USER_AGENT
        value: AI20k-Day04-Research-Agent/1.0 (educational lab)
